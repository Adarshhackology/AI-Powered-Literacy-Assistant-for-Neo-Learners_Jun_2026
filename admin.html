<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Management | LiteracyAI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fc;color:#1e2b55;font-family:Poppins,sans-serif}.top{padding:24px max(4vw,20px);background:linear-gradient(110deg,#172b65,#6753ce);color:#fff;display:flex;align-items:center;justify-content:space-between}.top a{color:#fff;text-decoration:none;font-size:.85rem}.wrap{width:min(1100px,92%);margin:32px auto}.intro{margin-bottom:24px}.intro h1{margin:0;font-size:1.8rem}.intro p{color:#69728d;font-size:.85rem}.grid{display:grid;grid-template-columns:370px 1fr;gap:22px}.card{padding:22px;border-radius:17px;background:#fff;box-shadow:0 8px 22px #1d2e5b12}.card h2{font-size:1.05rem;margin:0 0 16px}.field{margin-bottom:12px}.field label{font-size:.75rem;font-weight:600;display:block;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #dfe3f0;border-radius:8px;font:inherit;font-size:.8rem}.field textarea{min-height:75px;resize:vertical}.button{border:0;border-radius:8px;padding:10px 14px;background:#6656d4;color:#fff;font:600 .8rem Poppins;cursor:pointer}.button.danger{background:#e15670}.button.secondary{background:#edf0fb;color:#594ab9}.lesson{padding:15px;margin:10px 0;border:1px solid #e4e7f1;border-radius:11px}.lesson h3{margin:0;font-size:.88rem}.lesson p{font-size:.74rem;color:#66708b;margin:6px 0}.badge{display:inline-block;margin-right:5px;padding:3px 7px;border-radius:20px;background:#edeafe;color:#604fd0;font-size:.65rem}.actions{display:flex;gap:7px;margin-top:9px}.actions button{border:0;border-radius:6px;padding:6px 8px;font-size:.68rem;cursor:pointer}@media(max-width:750px){.grid{grid-template-columns:1fr}.top{padding:18px}.top h2{font-size:1rem}}
</style></head><body><header class="top"><h2><i class="fa-solid fa-sparkles"></i> LiteracyAI Content Management</h2><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Home</a></header><main class="wrap"><section class="intro"><h1>Curriculum & Lesson Repository</h1><p>Add, edit, and delete learning content for Beginner, Intermediate, and Advanced learners.</p></section><div class="grid"><section class="card"><h2 id="formTitle"><i class="fa-solid fa-plus"></i> Add a Lesson</h2><form id="lessonForm"><input id="lessonId" type="hidden"><div class="field"><label>Curriculum Category</label><select id="curriculum" required></select></div><div class="field"><label>Lesson Title</label><input id="title" required placeholder="Example: Greetings"></div><div class="field"><label>Language</label><select id="language"><option>English</option><option>Tamil</option><option>Hindi</option></select></div><div class="field"><label>Lesson Content</label><textarea id="content" required placeholder="Lesson explanation"></textarea></div><div class="field"><label>Exercise</label><textarea id="exercise" placeholder="Practice activity"></textarea></div><button class="button" id="saveButton">Save Lesson</button><button class="button secondary" type="button" onclick="resetForm()">Clear</button></form></section><section class="card"><h2><i class="fa-solid fa-list"></i> Available Lessons</h2><div id="lessons">Loading lessons...</div></section></div></main><script>
let curricula=[],lessons=[];const $=id=>document.getElementById(id);async function load(){curricula=await fetch('/api/curriculum').then(r=>r.json());lessons=await fetch('/api/lessons').then(r=>r.json());$('curriculum').innerHTML=curricula.map(c=>`<option value="${c.id}">${c.level} — ${c.category}</option>`).join('');$('lessons').innerHTML=lessons.length?lessons.map(l=>`<article class="lesson"><h3>${l.title}</h3><span class="badge">${l.level}</span><span class="badge">${l.language}</span><p>${l.content}</p><p><b>Exercise:</b> ${l.exercise||'None'}</p><div class="actions"><button class="button secondary" onclick="editLesson(${l.id})">Edit</button><button class="button danger" onclick="deleteLesson(${l.id})">Delete</button></div></article>`).join(''):'No lessons yet.'}function resetForm(){$('lessonForm').reset();$('lessonId').value='';$('formTitle').innerHTML='<i class="fa-solid fa-plus"></i> Add a Lesson';$('saveButton').textContent='Save Lesson'}function editLesson(id){const l=lessons.find(x=>x.id===id);$('lessonId').value=l.id;$('curriculum').value=l.curriculum_id;$('title').value=l.title;$('language').value=l.language;$('content').value=l.content;$('exercise').value=l.exercise||'';$('formTitle').textContent='Edit Lesson';$('saveButton').textContent='Update Lesson';window.scrollTo({top:0,behavior:'smooth'})}async function deleteLesson(id){if(confirm('Delete this lesson?')){await fetch('/api/lessons/'+id,{method:'DELETE'});load()}}$('lessonForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('lessonId').value,data={curriculum_id:Number($('curriculum').value),title:$('title').value,language:$('language').value,content:$('content').value,exercise:$('exercise').value};await fetch(id?'/api/lessons/'+id:'/api/lessons',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});resetForm();load()});load();
</script></body></html>
